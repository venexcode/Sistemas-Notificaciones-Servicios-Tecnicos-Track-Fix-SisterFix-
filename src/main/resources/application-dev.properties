# Perfil de desarrollo

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:sisterfixdb;DB_CLOSE_ON_EXIT=FALSE;DB_CLOSE_DELAY=-1

# Consola H2 (solo desarrollo)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.format_sql=true

# SQL por logging (se puede subir o bajar sin tocar JPA)
logging.level.org.hibernate.SQL=debug

# Descomenta si agregas un data.sql con datos iniciales
# spring.jpa.defer-datasource-initialization=true

sisterfix.admin.usuario=admin
sisterfix.admin.password=admin1234