# Configuracion comun a todos los perfiles (guardar siempre como UTF-8)
spring.application.name=sisterfix
server.port=8080

# Perfil por defecto: dev. En produccion: SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=dev

# JPA
spring.jpa.open-in-view=false

# Paginas de error propias (templates/error.html)
server.error.whitelabel.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never