<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Orden - Track & Fix</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <a href="/tracking" class="logo">🛠️ Track & Fix</a>
</header>

<main th:if="${orden}">
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>
                <span class="badge badge-info" th:text="${orden.codigoSeguimiento}">TRK-XXXXXX</span>
                <h2 style="margin-top: 0.5rem;" th:text="${orden.dispositivo}">Dispositivo</h2>
            </div>
            <div>
                <span class="badge badge-success" th:text="${orden.estadoActual}">ESTADO</span>
            </div>
        </div>

        <p style="margin-top: 1rem; color: var(--text-secondary);">
            <strong>Problema Reportado:</strong> <span th:text="${orden.problemaReportado}">Detalle del problema</span>
        </p>
    </div>

    <div class="card">
        <h3>Historial de Cambios</h3>
        <ul class="timeline">
            <li class="timeline-item" th:each="item : ${orden.historial}">
                <div>
                    <strong th:text="${item.estadoNuevo}">NUEVO_ESTADO</strong>
                    <span style="font-size: 0.85rem; color: var(--text-secondary); margin-left: 0.5rem;"
                          th:text="${#temporals.format(item.fechaCambio, 'dd/MM/yyyy HH:mm')}">01/10/2026 14:30</span>
                </div>
                <p style="margin-top: 0.25rem; color: var(--text-secondary);" th:text="${item.observaciones}">Observaciones</p>
            </li>
        </ul>
        <div style="margin-top: 2rem;">
            <a href="/tracking" class="btn" style="background-color: var(--text-secondary);">← Consultar otra orden</a>
        </div>
    </div>
</main>
</body>
</html>
