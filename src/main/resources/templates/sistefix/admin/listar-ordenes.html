<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración - Track & Fix</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <a href="/admin/ordenes" class="logo">🛠️ Panel Taller</a>
</header>

<main>
    <div class="card">
        <h2>Gestión de Órdenes de Trabajo</h2>
        <table>
            <thead>
            <tr>
                <th>Código</th>
                <th>Cliente</th>
                <th>Dispositivo</th>
                <th>Estado Actual</th>
                <th>Actualizar Estado</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="o : ${ordenes}">
                <td th:text="${o.codigoSeguimiento}">TRK-123456</td>
                <td th:text="${o.cliente.nombre}">Nombre Cliente</td>
                <td th:text="${o.dispositivo}">Equipo</td>
                <td>
                    <span class="badge badge-info" th:text="${o.estadoActual}">RECIBIDO</span>
                </td>
                <td>
                    <form th:action="@{/admin/ordenes/{id}/actualizar-estado(id=${o.id})}" method="post" style="display: flex; gap: 0.5rem;">
                        <select name="nuevoEstado" class="input-control" style="padding: 0.25rem;" required>
                            <option th:each="estado : ${T(vnx.sisterfix.domain.enums.EstadoOrden).values()}"
                                    th:value="${estado}"
                                    th:text="${estado}">
                            </option>
                        </select>
                        <input type="text" name="observaciones" placeholder="Nota del técnico" class="input-control" style="padding: 0.25rem;" required>
                        <button type="submit" class="btn" style="padding: 0.25rem 0.75rem;">Guardar</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
