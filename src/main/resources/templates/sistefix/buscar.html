<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track & Fix - Consulta de Estado</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header>
    <a href="/tracking" class="logo">🛠️ Track & Fix</a>
</header>

<main>
    <div class="card">
        <h2>Seguimiento de tu Servicio Técnico</h2>
        <p style="color: var(--text-secondary); margin-top: 0.5rem;">
            Ingresa el código de seguimiento de 6 caracteres impreso en tu comprobante.
        </p>

        <form th:action="@{/tracking/consultar}" method="get" class="search-box">
            <input type="text"
                   name="codigo"
                   class="input-control"
                   placeholder="Ejemplo: TRK-A8F2K9"
                   required
                   style="text-transform: uppercase;">
            <button type="submit" class="btn">Consultar</button>
        </form>

        <div th:if="${error}" style="margin-top: 1rem; padding: 1rem; background-color: #fee2e2; color: #991b1b; border-radius: 8px;">
            <p th:text="${error}"></p>
        </div>
    </div>
</main>
</body>
</html>
