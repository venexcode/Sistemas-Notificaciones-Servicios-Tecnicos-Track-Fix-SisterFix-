<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Acceso al taller')}"></head>
<body>
<main class="stage">
    <header class="topbar">
        <a th:replace="~{fragments/base :: marca}"></a>
    </header>

    <section class="hero">
        <div>
            <h1>Entrada al taller.</h1>
            <p>Inicia sesión para ver las órdenes y actualizar el estado de cada equipo.</p>
        </div>

        <div class="tag-wrap">
            <form class="tag" th:action="@{/login}" method="post">
                <div class="notice" th:if="${param.error}" role="alert">
                    <strong>Usuario o contraseña incorrectos.</strong>
                    Revisa los datos e inténtalo de nuevo.
                </div>
                <div class="notice notice--ok" th:if="${param.logout}" role="status">
                    <strong>Cerraste sesión.</strong>
                </div>

                <div class="field">
                    <label class="field-label" for="username">Usuario</label>
                    <input class="code-input" id="username" name="username" type="text"
                           autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
                </div>
                <div class="field">
                    <label class="field-label" for="password">Contraseña</label>
                    <input class="code-input" id="password" name="password" type="password"
                           autocomplete="current-password" required>
                </div>

                <button class="btn btn--block" type="submit">Entrar al panel</button>
                <p class="stub">Si eres cliente, consulta tu equipo desde la <a th:href="@{/sisterfix}">página de seguimiento</a>.</p>
            </form>
        </div>
    </section>
</main>
</body>
</html>
