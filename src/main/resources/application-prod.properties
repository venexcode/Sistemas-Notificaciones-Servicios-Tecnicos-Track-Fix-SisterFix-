# Perfil de produccion: las credenciales vienen de variables de entorno

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Consola H2 desactivada
spring.h2.console.enabled=false

# El esquema NO se genera automaticamente: debe existir (idealmente con Flyway o Liquibase)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# No exponer detalles de errores al usuario
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.root=info

# Administrador del panel: definelos como variables de entorno
sisterfix.admin.usuario=${ADMIN_USER}
sisterfix.admin.password=${ADMIN_PASSWORD}

# Direccion publica del sitio (la usa el QR de las etiquetas), por ejemplo https://taller.ejemplo.com
sisterfix.url-publica=${URL_PUBLICA}
server.forward-headers-strategy=framework